name: build-and-bughunt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and package the mod
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Validate assets and metadata
        run: python3 scripts/bughunt.py
      - name: Compile, test and remap
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean check build 2>&1 | tee gradle-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: ignore
      - name: Inspect produced jars
        run: python3 scripts/bughunt.py --jar "$(find build/libs -maxdepth 1 -type f -name 'rival-realms-*.jar' ! -name '*-sources.jar' | head -n 1)"
      - name: Upload release-ready jars
        uses: actions/upload-artifact@v4
        with:
          name: rival-realms-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
