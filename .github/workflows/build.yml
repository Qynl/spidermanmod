name: build

on:
  push:
    branches: [arena/01a08f93-spidermanmod, arena/01a09235-spidermanmod, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Report build failure (create issue with log)
        if: failure() && github.ref == 'refs/heads/arena/01a09235-spidermanmod'
        run: |
          echo "=== gradle log tail ===" > /tmp/fail.txt
          tail -n 500 /tmp/gradle.log >> /tmp/fail.txt 2>&1 || true
          echo "--- build dir ---" >> /tmp/fail.txt
          ls -lh build/ >> /tmp/fail.txt 2>&1 || true
          echo "--- trying issue create ---" >> /tmp/fail.txt
          cat /tmp/fail.txt
          gh issue create --title "gradle build failed $GITHUB_RUN_ID $GITHUB_SHA" --body-file /tmp/fail.txt || echo "issue create failed" >> /tmp/fail.txt
          # Also commit log to branch as fallback (so we can git show it)
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          cp /tmp/gradle.log ./gradle-failure.log || true
          cp /tmp/fail.txt ./gradle-failure-tail.log || true
          git add -f gradle-failure.log gradle-failure-tail.log || true
          git commit -m "gradle failure log $GITHUB_RUN_ID [skip ci]" || true
          git push origin HEAD:arena/01a09235-spidermanmod || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Commit jar to branch (for arena)
        if: github.ref == 'refs/heads/arena/01a09235-spidermanmod'
        run: |
          set -x
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          ls -lh build/libs/
          # Find jar with classes (skip sources jar)
          MAIN_JAR=""
          for f in build/libs/*.jar; do
            if echo "$f" | grep -q sources; then continue; fi
            if python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(any(n.endswith('.class') for n in z.namelist()))" "$f" | grep -q True; then
              MAIN_JAR="$f"
              break
            fi
          done
          if [ -z "$MAIN_JAR" ]; then
            MAIN_JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          fi
          echo "Selected MAIN_JAR=$MAIN_JAR"
          DEST="build/libs/spiderman-1.0.0.jar"
          if [ "$MAIN_JAR" != "$DEST" ]; then
            cp "$MAIN_JAR" "$DEST"
          fi
          ls -lh "$DEST"
          git add -f "$DEST"
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Build jar from CI for arena/01a09235-spidermanmod [skip ci]"
            git push origin HEAD:arena/01a09235-spidermanmod
          else
            echo "No changes to jar"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Validates the offline toolchain (build-local/): stub generation, named
  # compile, Yarn -> Intermediary remap, refmap, jar checks, unit tests.
  local-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Offline build + unit tests
        run: |
          chmod +x build-local/build.sh build-local/test.sh
          export JAVAC="$JAVA_HOME/bin/javac"
          ./build-local/build.sh
          ./build-local/test.sh

      - name: Upload offline jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar-offline
          path: build-local/spiderman-*.jar
          if-no-files-found: warn
