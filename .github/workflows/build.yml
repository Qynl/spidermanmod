name: build

on:
  push:
    branches: [arena/01a08f93-spidermanmod, arena/01a09235-spidermanmod, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Commit jar to branch (for arena)
        if: github.ref == 'refs/heads/arena/01a09235-spidermanmod'
        run: |
          set -x
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          ls -lh build/libs/
          # Loom produces main jar + sources jar; we want main jar (not sources, not dev)
          # Prefer the non-sources jar that contains classes
          MAIN_JAR="build/libs/spiderman-1.0.0.jar"
          if [ ! -f "$MAIN_JAR" ]; then
            # fallback: find first jar that is not sources and not dev
            MAIN_JAR=$(ls build/libs/*.jar | grep -v sources | grep -v dev | head -n 1)
          fi
          echo "MAIN_JAR=$MAIN_JAR"
          if [ ! -f "$MAIN_JAR" ]; then
            echo "Main jar not found!"
            ls -R build/libs
            exit 1
          fi
          # Verify it contains classes, not just java sources
          if command -v python3 >/dev/null; then
            python3 - << PY
          import zipfile, sys
          jar=sys.argv[1]
          with zipfile.ZipFile(jar) as z:
              has_class=any(n.endswith(".class") for n in z.namelist())
              print(f"has_class={has_class}")
              if not has_class:
                  print("ERROR: jar has no .class files, listing:")
                  print(z.namelist()[:30])
                  sys.exit(1)
          PY "$MAIN_JAR"
          fi
          DEST="build/libs/spiderman-1.0.0.jar"
          if [ "$MAIN_JAR" != "$DEST" ]; then
            cp "$MAIN_JAR" "$DEST"
          fi
          ls -lh "$DEST"
          git add -f "$DEST"
          git status
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Build jar from CI for arena/01a09235-spidermanmod [skip ci]"
            git push origin HEAD:arena/01a09235-spidermanmod
          else
            echo "No changes to jar"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Validates the offline toolchain (build-local/): stub generation, named
  # compile, Yarn -> Intermediary remap, refmap, jar checks, unit tests.
  local-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Offline build + unit tests
        run: |
          chmod +x build-local/build.sh build-local/test.sh
          export JAVAC="$JAVA_HOME/bin/javac"
          ./build-local/build.sh
          ./build-local/test.sh

      - name: Upload offline jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar-offline
          path: build-local/spiderman-*.jar
          if-no-files-found: warn
