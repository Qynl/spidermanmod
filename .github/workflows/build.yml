name: build

on:
  push:
    branches: [arena/01a08f93-spidermanmod, arena/01a09235-spidermanmod, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Commit jar to branch (for arena)
        if: github.ref == 'refs/heads/arena/01a09235-spidermanmod'
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          mkdir -p build/libs
          cp build/libs/*.jar build/libs/spiderman-1.0.0.jar || true
          git add -f build/libs/spiderman-1.0.0.jar
          git diff --cached --quiet || git commit -m "Build jar from CI for arena/01a09235-spidermanmod [skip ci]"
          git push origin HEAD:arena/01a09235-spidermanmod || true

  # Validates the offline toolchain (build-local/): stub generation, named
  # compile, Yarn -> Intermediary remap, refmap, jar checks, unit tests.
  local-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Offline build + unit tests
        run: |
          chmod +x build-local/build.sh build-local/test.sh
          export JAVAC="$JAVA_HOME/bin/javac"
          ./build-local/build.sh
          ./build-local/test.sh

      - name: Upload offline jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar-offline
          path: build-local/spiderman-*.jar
          if-no-files-found: warn
