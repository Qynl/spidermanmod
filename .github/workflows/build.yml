name: build

on:
  push:
    branches: [arena/01a08f93-spidermanmod, arena/01a09235-spidermanmod, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Commit jar to branch (for arena)
        if: github.ref == 'refs/heads/arena/01a09235-spidermanmod'
        run: |
          set +e
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          ls -lh build/libs/ > /tmp/list.txt 2>&1
          echo "--- all jars ---" >> /tmp/list.txt
          for f in build/libs/*.jar; do
            echo "== $f ==" >> /tmp/list.txt
            ls -lh "$f" >> /tmp/list.txt 2>&1
            python3 - << PY >> /tmp/list.txt 2>&1
          import zipfile, sys, glob
          for jar_path in glob.glob("build/libs/*.jar"):
              print(f"\n== {jar_path} ==")
              try:
                with zipfile.ZipFile(jar_path) as z:
                  names=z.namelist()
                  has_class=any(n.endswith(".class") for n in names)
                  has_java=any(n.endswith(".java") for n in names)
                  print(f"  entries={len(names)} has_class={has_class} has_java={has_java}")
                  if has_class:
                    print("  sample classes:", [n for n in names if n.endswith(".class")][:10])
                  else:
                    print("  sample:", names[:20])
              except Exception as e:
                print(f"  error reading jar: {e}")
          PY
            break
          done
          cat /tmp/list.txt
          # Find jar with classes, not sources
          MAIN_JAR=""
          for f in build/libs/*.jar; do
            if echo "$f" | grep -q sources; then continue; fi
            if python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(any(n.endswith('.class') for n in z.namelist()))" "$f" | grep -q True; then
              MAIN_JAR="$f"
              break
            fi
          done
          if [ -z "$MAIN_JAR" ]; then
            echo "No jar with classes found!" | tee -a /tmp/list.txt
            MAIN_JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          fi
          echo "Selected MAIN_JAR=$MAIN_JAR" | tee -a /tmp/list.txt
          if [ -z "$MAIN_JAR" ] || [ ! -f "$MAIN_JAR" ]; then
            echo "Main jar not found!" | tee -a /tmp/list.txt
            gh issue create --title "jar debug $GITHUB_RUN_ID no class jar" --body-file /tmp/list.txt || true
            exit 1
          fi
          DEST="build/libs/spiderman-1.0.0.jar"
          if [ "$MAIN_JAR" != "$DEST" ]; then
            cp "$MAIN_JAR" "$DEST"
          fi
          ls -lh "$DEST" | tee -a /tmp/list.txt
          # Verify DEST has classes
          python3 - << PY
          import zipfile, sys
          jar="build/libs/spiderman-1.0.0.jar"
          with zipfile.ZipFile(jar) as z:
              has_class=any(n.endswith(".class") for n in z.namelist())
              print(f"DEST has_class={has_class}")
              if not has_class:
                  print("DEST missing classes!")
                  sys.exit(1)
          PY
          if [ $? -ne 0 ]; then
            echo "DEST jar missing classes, failing" | tee -a /tmp/list.txt
            gh issue create --title "jar debug $GITHUB_RUN_ID DEST no class" --body-file /tmp/list.txt || true
            exit 1
          fi
          git add -f "$DEST"
          git status
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Build jar from CI for arena/01a09235-spidermanmod [skip ci]"
            git push origin HEAD:arena/01a09235-spidermanmod || {
              echo "push failed" | tee -a /tmp/list.txt
              gh issue create --title "jar push failed $GITHUB_RUN_ID" --body-file /tmp/list.txt || true
              exit 1
            }
          else
            echo "No changes to jar"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Validates the offline toolchain (build-local/): stub generation, named
  # compile, Yarn -> Intermediary remap, refmap, jar checks, unit tests.
  local-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Offline build + unit tests
        run: |
          chmod +x build-local/build.sh build-local/test.sh
          export JAVAC="$JAVA_HOME/bin/javac"
          ./build-local/build.sh
          ./build-local/test.sh

      - name: Upload offline jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiderman-jar-offline
          path: build-local/spiderman-*.jar
          if-no-files-found: warn
